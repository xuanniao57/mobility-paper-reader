<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a42b32"><title>行读 · 研究文献工作台</title><link rel="stylesheet" href="workbench.css"></head><body>
<header><a href="index.html" class="brand">行读 <small>RESEARCH LIBRARY</small></a><button id="home">项目</button><button id="notes">批注</button></header>

<button id="quote" hidden>批注所选文字</button><div id="status" role="status"></div><input id="import" type="file" accept="application/json" hidden>
